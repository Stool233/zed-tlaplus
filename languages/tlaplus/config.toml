name = "TLA+"
grammar = "tlaplus"
path_suffixes = ["tla"]
first_line_pattern = '^\s*-{4,}\s*MODULE\s+\w+\s*-{4,}'
line_comments = ['\* ']
block_comment = ["(* ", " *)"]
tab_size = 4
hard_tabs = false
autoclose_before = ",:;)]}"

# A prime denotes the next-state value in TLA+, so it is NOT a quote pair.
brackets = [
    { start = "(*", end = "*)", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "[", end = "]", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "{", end = "}", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "<<", end = ">>", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "⟨", end = "⟩", close = true, newline = false, not_in = ["string", "comment"] },
    { start = '"', end = '"', close = true, newline = false, not_in = ["string", "comment"] },
]
